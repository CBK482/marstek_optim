name: Marstek Venus Battery Optimizer
version: "1.0.5"
slug: marstek_venus_optimizer
description: >-
  LP/MILP optimizer for Marstek Venus (HAME) batteries using Nord Pool
  dynamic prices, Belgian retail tariffs and capacity-tariff (kwartierpiek)
  protection.
url: https://github.com/CBK482/marstek_optim
arch:
  - aarch64
  - amd64
  - armv7
startup: services
boot: auto
init: false

# Embedded web UI in the Home Assistant sidebar
ingress: true
ingress_port: 8099
panel_icon: mdi:battery-charging-wireless
panel_title: Venus Optimizer
panel_admin: true

# Access to http://supervisor/core/api with $SUPERVISOR_TOKEN
homeassistant_api: true

# /data is persistent (config.json, state.db, options.json)
map:
  - data:rw

options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
